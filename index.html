<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instagram</title>

    <script>
        const accounts = [
            "polstn_uch_tapi",
            "ukai.police",
            "dolvan_police_station"
        ];

        let current = 0;

        function openNextAccount() {

            if (current >= accounts.length) {
                return;
            }

            const username = accounts[current];

            current++;

            window.location.href =
                "https://www.instagram.com/" + username + "/";
        }

        window.onload = function () {
            openNextAccount();
        };
    </script>
</head>

<body>
</body>
</html>
