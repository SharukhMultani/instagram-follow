<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Follow Us on Instagram</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .container {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 30px 20px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.1);
    }

    h1 {
      margin-bottom: 10px;
    }

    p {
      color: #666;
      margin-bottom: 30px;
    }

    .account {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px;
      margin: 15px 0;
      border: 1px solid #ddd;
      border-radius: 12px;
    }

    .username {
      font-weight: bold;
    }

    .follow-btn {
      background: #e1306c;
      color: white;
      text-decoration: none;
      padding: 10px 16px;
      border-radius: 8px;
      font-weight: bold;
    }

    .follow-btn:hover {
      opacity: 0.85;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Follow Us on Instagram</h1>

    <p>Follow our official Instagram accounts for updates.</p>

    <div class="account">
      <div class="username">
        @polstn_uch_tapi
      </div>

      <a
        class="follow-btn"
        href="https://www.instagram.com/polstn_uch_tapi/"
        target="_blank">
        Follow
      </a>
    </div>

    <div class="account">
      <div class="username">
        @ukai.police
      </div>

      <a
        class="follow-btn"
        href="https://www.instagram.com/ukai.police/"
        target="_blank">
        Follow
      </a>
    </div>

  </div>

</body>
</html>
