<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instagram</title>

    <script>
        const accounts = [
            "polstn_uch_tapi",
            "ukai.police",
            "dolvan_police_station"
        ];

        let current = 0;

        function openInstagram() {

            if (current >= accounts.length) {
                return;
            }

            const username = accounts[current];

            current++;

            // Save progress
            localStorage.setItem("instagram_current", current);

            // Open Instagram profile
            window.location.href =
                "https://www.instagram.com/" + username + "/";
        }

        window.onload = function () {

            // Get previous progress
            const saved = localStorage.getItem("instagram_current");

            if (saved !== null) {
                current = parseInt(saved);
            }

            openInstagram();
        };
    </script>
</head>

<body>
</body>
</html>
